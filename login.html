<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – Tap2Send</title>
<link rel="stylesheet" href="https://cdn.tailwindcss.com">
<style>
:root { --green:#0C7A43; --gold:#D4AF37; --blue:#1E3A8A; }
.bg-animate{
  background:linear-gradient(135deg,var(--blue),var(--green));
  background-size:300% 300%;
  animation:move 9s infinite alternate;
}
@keyframes move{
  0%{background-position:0 0;}
  100%{background-position:100% 100%;}
}
.glow-btn{
  background:var(--green);
  border:2px solid var(--gold);
  transition:.3s;
}
.glow-btn:hover{
  transform:scale(1.03);
  box-shadow:0 0 25px rgba(212,175,55,.4);
}
</style>
</head>

<body class="bg-animate min-h-screen flex justify-center items-center p-4">

<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">

  <h1 class="text-3xl font-bold text-green-700 mb-6">Welcome Back</h1>

  <input id="email" type="email"
    class="w-full p-3 border rounded-lg mb-3"
    placeholder="Email">

  <input id="password" type="password"
    class="w-full p-3 border rounded-lg mb-6"
    placeholder="Password">

  <button onclick="login()"
    class="glow-btn text-white w-full py-3 rounded-xl font-bold">
    Login
  </button>

  <p class="mt-4 text-gray-600">
    Create new account?
    <a href="signup.html" class="text-blue-700 font-semibold">Sign Up</a>
  </p>

  <p id="msg" class="mt-4 font-semibold"></p>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDQMbfvjHV-1I3UEHt3asuEBNOO2Qh3RFA",
  authDomain: "tap2send-8e72d.firebaseapp.com",
  projectId: "tap2send-8e72d",
  storageBucket: "tap2send-8e72d.firebasestorage.app",
  messagingSenderId: "572191430506",
  appId: "1:572191430506:web:3100a351c4be63fbf6b713"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// LOGIN FUNCTION
async function login(){
  const email = document.getElementById("email").value;
  const pass  = document.getElementById("password").value;
  const msg   = document.getElementById("msg");

  try {
    await auth.signInWithEmailAndPassword(email, pass);

    msg.innerHTML = "Login successful! Redirecting...";
    msg.style.color = "green";

    setTimeout(()=> window.location.href = "dashboard.html", 1000);
  }
  catch(err){
    msg.innerHTML = err.message;
    msg.style.color = "red";
  }
}
</script>

</body>
</html>
