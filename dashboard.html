<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap2Send • Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>

<style>
:root {
    --green: #0C7A43;
    --gold: #D4AF37;
    --blue: #1E3A8A;
    --white: #FFFFFF;
}

body {
    background: radial-gradient(circle at 15% 10%, rgba(12,122,67,0.3), transparent),
                radial-gradient(circle at 85% 90%, rgba(30,58,138,0.3), transparent),
                #000;
    min-height: 100vh;
}

.light {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 100%;
    filter: blur(160px);
    z-index: -1;
    animation: float 8s infinite alternate;
}
.light.green { background: var(--green); top: 10%; left: 10%; }
.light.blue  { background: var(--blue); bottom: 10%; right: 10%; }

@keyframes float {
    0% { transform: translateY(0px) translateX(0px); }
    100% { transform: translateY(-40px) translateX(40px); }
}

.card {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(12px);
    border-radius: 18px;
    padding: 24px;
    transition: 0.3s;
}
.card:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.15);
}
</style>
</head>

<body>

<div class="light green"></div>
<div class="light blue"></div>

<!-- NAV -->
<nav class="w-full bg-black/30 backdrop-blur-xl p-4 px-6 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-3xl font-bold text-white">Tap<span class="text-green-300">2</span>Send</h1>
    <div class="flex items-center gap-4">
        <span id="navEmail" class="text-gray-300 text-sm"></span>
        <button onclick="logout()" class="px-4 py-2 bg-red-500/80 hover:bg-red-600 rounded-xl text-white">
            Logout
        </button>
    </div>
</nav>

<div class="max-w-6xl mx-auto px-4 py-10">

    <h2 class="text-4xl font-bold text-white mb-8">Dashboard</h2>

    <!-- TOKEN ALERT -->
    <div id="tokenAlert" class="hidden p-4 rounded-xl mb-8 text-white font-medium"></div>

    <!-- GRID -->
    <div class="grid md:grid-cols-3 gap-6 mb-10">

        <div class="card text-white">
            <h3 class="text-xl font-bold mb-2">WhatsApp Status</h3>
            <p id="w_status" class="text-gray-300">Checking…</p>
        </div>

        <div class="card text-white">
            <h3 class="text-xl font-bold mb-2">Today Messages</h3>
            <p id="w_today" class="text-3xl font-bold">0</p>
        </div>

        <div class="card text-white">
            <h3 class="text-xl font-bold mb-2">Total Messages</h3>
            <p id="w_total" class="text-3xl font-bold">0</p>
        </div>

    </div>

    <!-- QUICK ACTIONS -->
    <h3 class="text-2xl font-bold text-white mb-4">Quick Actions</h3>

    <div class="grid md:grid-cols-4 gap-6">
        <a href="connect-whatsapp.html" class="card text-center text-white cursor-pointer">
            <div class="text-4xl mb-2">🔗</div>
            Connect WhatsApp
        </a>

        <a href="campaigns.html" class="card text-center text-white cursor-pointer">
            <div class="text-4xl mb-2">📢</div>
            Create Campaign
        </a>

        <a href="templates.html" class="card text-center text-white cursor-pointer">
            <div class="text-4xl mb-2">📄</div>
            Templates
        </a>

        <a href="automation.html" class="card text-center text-white cursor-pointer">
            <div class="text-4xl mb-2">🤖</div>
            Automation Builder
        </a>
    </div>

</div>

<script>
// FIREBASE CONFIG (YOUR LIVE CONFIG)
const firebaseConfig = {
  apiKey: "AIzaSyDQMbfvjHV-1I3UEHt3asuEBNOO2Qh3RFA",
  authDomain: "tap2send-8e72d.firebaseapp.com",
  projectId: "tap2send-8e72d",
  storageBucket: "tap2send-8e72d.firebasestorage.app",
  messagingSenderId: "572191430506",
  appId: "1:572191430506:web:3100a351c4be63fbf6b713"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

auth.onAuthStateChanged(async (user) => {
    if (!user) {
        location.href = "auth.html";
        return;
    }
    currentUser = user;
    document.getElementById("navEmail").innerText = user.email;

    await loadWhatsappData();
});

// FETCH WHATSAPP DETAILS
async function loadWhatsappData() {
    const doc = await db.collection("whatsappAccounts").doc(currentUser.uid).get();

    if (!doc.exists) {
        document.getElementById("w_status").innerText = "Not Connected";
        return;
    }

    const data = doc.data();

    document.getElementById("w_status").innerText = "Connected";
    document.getElementById("w_total").innerText = data.totalMessages || 0;
    document.getElementById("w_today").innerText = data.todayMessages || 0;

    checkTokenExpiry(data.connected_at);
}
