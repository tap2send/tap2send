<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts – Tap2Send</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.3.2/papaparse.min.js"></script>
  
  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDQMbfvjHV-1I3UEHt3asuEBNOO2Qh3RFA",
      authDomain: "tap2send-8e72d.firebaseapp.com",
      projectId: "tap2send-8e72d",
      storageBucket: "tap2send-8e72d.firebasestorage.app",
      messagingSenderId: "572191430506",
      appId: "1:572191430506:web:3100a351c4be63fbf6b713"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth();

    let userId = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        userId = user.uid;
        loadContacts();
      }
    });

    // Add Contact
    window.addContact = async () => {
      const name = document.getElementById("contact-name").value;
      const phone = document.getElementById("contact-phone").value;
      const tag = document.getElementById("contact-tag").value;

      if (!name || !phone) {
        alert("Name & Phone are required!");
        return;
      }

      await addDoc(collection(db, "users", userId, "contacts"), {
        name,
        phone,
        tag,
        created: Date.now()
      });

      document.getElementById("contact-name").value = "";
      document.getElementById("contact-phone").value = "";
      document.getElementById("contact-tag").value = "";

      loadContacts();
    };

    // Load Contacts
    window.loadContacts = async () => {
      const table = document.getElementById("contact-table");
      table.innerHTML = "";

      const querySnapshot = await getDocs(collection(db, "users", userId, "contacts"));
      querySnapshot.forEach((docSnap) => {
        const c = docSnap.data();
        table.innerHTML += `
          <tr class="border-b">
            <td class="p-2">${c.name}</td>
            <td class="p-2">${c.phone}</td>
            <td class="p-2">${c.tag || "-"}</td>
            <td class="p-2">
              <button onclick="deleteContact('${docSnap.id}')" 
              class="bg-red-500 text-white px-3 py-1 rounded">
                Delete
              </button>
            </td>
          </tr>
        `;
      });
    };

    // Delete Contact
    window.deleteContact = async (id) => {
      await deleteDoc(doc(db, "users", userId, "contacts", id));
      loadContacts();
    };

    // Export CSV
    window.exportCSV = async () => {
      const querySnapshot = await getDocs(collection(db, "users", userId, "contacts"));
      const contacts = [];
      querySnapshot.forEach(docSnap => contacts.push(docSnap.data()));

      const csv = Papa.unparse(contacts);
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "contacts.csv";
      link.click();
    };

    // Import CSV
    window.importCSV = (event) => {
      Papa.parse(event.target.files[0], {
        header: true,
        skipEmptyLines: true,
        complete: async function(result) {
          for (let row of result.data) {
            await addDoc(collection(db, "users", userId, "contacts"), row);
          }
          loadContacts();
        }
      });
    };
  </script>

  <style>
    body {
      background: linear-gradient(to bottom, #008060, #004d40);
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>

<body class="text-white">
  <div class="max-w-4xl mx-auto mt-10 bg-white text-black rounded-2xl p-6 shadow-xl">

    <h1 class="text-3xl font-bold text-green-700 mb-6">📇 Contacts Manager</h1>

    <!-- Add Contact Form -->
    <div class="grid grid-cols-3 gap-4 mb-4">
      <input id="contact-name" class="border p-2 rounded" placeholder="Name">
      <input id="contact-phone" class="border p-2 rounded" placeholder="Phone">
      <input id="contact-tag" class="border p-2 rounded" placeholder="Tag (optional)">
    </div>

    <button onclick="addContact()"
    class="bg-green-600 text-white px-4 py-2 rounded-lg mb-6 hover:bg-green-700">
      + Add Contact
    </button>

    <!-- Import / Export -->
    <div class="flex gap-4 mb-6">
      <input type="file" accept=".csv" onchange="importCSV(event)" class="bg-gray-200 p-2 rounded">
      <button onclick="exportCSV()" class="bg-blue-600 text-white px-4 py-2 rounded">Export CSV</button>
    </div>

    <!-- Contacts Table -->
    <table class="w-full bg-gray-100 rounded">
      <thead class="bg-green-600 text-white">
        <tr>
          <th class="p-2">Name</th>
          <th class="p-2">Phone</th>
          <th class="p-2">Tag</th>
          <th class="p-2">Action</th>
        </tr>
      </thead>
      <tbody id="contact-table"></tbody>
    </table>

    <!-- Support / Ticket -->
    <div class="mt-10 p-4 bg-yellow-100 rounded">
      <h2 class="text-xl font-bold text-yellow-800">Need Help?</h2>
      <p>Email: <b>tap2send@gmail.com</b></p>
      <p>Phone: <b>9019254743</b></p>
      <p class="mt-2">
        Raise a ticket by sending your issue to our support email.  
        We reply in **under 10 minutes**.
      </p>
    </div>

  </div>
</body>
</html>
