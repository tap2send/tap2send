<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tap2Send – Unlimited WhatsApp Messaging</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
<style>

/* -------- GLOBAL BRAND COLORS -------- */
:root {
  --green: #0C7A43;
  --gold: #D4AF37;
  --blue: #1E3A8A;
  --white: #ffffff;
}

/* Cinematic Background */
.hero-bg {
  background: linear-gradient(135deg, var(--green), var(--blue));
  background-size: 400% 400%;
  animation: gradientMove 12s ease infinite;
}

@keyframes gradientMove {
  0% { background-position: 0% 0%; }
  50% { background-position: 100% 100%; }
  100% { background-position: 0% 0%; }
}

/* Floating Particles */
.particle {
  position: absolute;
  width: 8px;
  height: 8px;
  background: rgba(255,255,255,0.3);
  border-radius: 50%;
  animation: float 6s infinite ease-in-out;
}

@keyframes float {
  0% { transform: translateY(0px) scale(1); }
  50% { transform: translateY(-40px) scale(1.3); }
  100% { transform: translateY(0px) scale(1); }
}

/* Cinematic Text Entrance */
@keyframes fadeUp {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0px); }
}
.fadeUp { animation: fadeUp 1s ease forwards; }

/* Glow Button */
.glow-btn {
  background: var(--green);
  border: 2px solid var(--gold);
  transition: 0.3s;
}
.glow-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 25px rgba(212,175,55,0.5);
}

</style>
</head>

<body class="bg-white">

<!-- NAVBAR -->
<nav class="w-full py-4 px-8 flex justify-between items-center bg-white shadow">
  <h1 class="text-2xl font-bold text-green-600">Tap2Send</h1>
  <div class="space-x-6 hidden md:flex">
    <a href="pricing.html" class="hover:text-green-600">Pricing</a>
    <a href="login.html" class="hover:text-green-600">Login</a>
    <a href="signup.html" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">Get Started</a>
  </div>
</nav>

<!-- HERO SECTION -->
<section class="hero-bg relative w-full h-screen text-white flex flex-col justify-center items-center text-center px-6">

  <!-- Particles -->
  <div class="particle" style="top:20%; left:25%; animation-delay:0s"></div>
  <div class="particle" style="top:40%; left:60%; animation-delay:1s"></div>
  <div class="particle" style="top:70%; left:30%; animation-delay:2s"></div>
  <div class="particle" style="top:50%; left:80%; animation-delay:3s"></div>

  <h1 class="text-5xl md:text-7xl font-extrabold fadeUp" style="animation-delay:0.3s">
    Unlimited WhatsApp Messaging.
  </h1>

  <p class="mt-4 text-xl md:text-2xl fadeUp max-w-2xl" style="animation-delay:0.6s">
    One-click connect your WhatsApp Cloud API. Send unlimited broadcasts,
    automation, chatbot, funnels — all inside <span class="text-gold font-bold">Tap2Send</span>.
  </p>

  <a href="signup.html"
     class="glow-btn mt-10 px-8 py-4 rounded-xl text-xl font-bold fadeUp"
     style="animation-delay:1s">
    Start Free
  </a>

</section>

</body>
</html>
